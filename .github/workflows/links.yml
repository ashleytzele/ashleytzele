# Checks every link in README.md weekly, and whenever the README changes.
# A broken link (e.g. a moved repo or a site that went down) turns the badge red.
name: Check links

on:
  schedule:
    - cron: "23 15 * * 1"   # Mondays
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md]

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          # LinkedIn answers bots with status 999, so it is skipped rather than reported broken.
          # The 3D graph images are generated by another workflow, so they are not checked here.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude "linkedin\.com"
            --exclude "profile-3d-contrib"
            README.md
          fail: true
